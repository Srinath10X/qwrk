name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test qwrk
        working-directory: packages/qwrk-core
        run: npm install && npm test

      - name: Test qwrk-vite
        working-directory: packages/qwrk-vite
        run: npm install && npm test

      - name: Test create-qwrk-app
        working-directory: packages/qwrk-app
        run: npm install && npm test
